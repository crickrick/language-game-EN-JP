<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>えいごだーけ オンライン</title>
  <style>
    :root{--navy:#17213d;--yellow:#f7d85b;--pink:#f08a8c;--mint:#bde7dc;--paper:#fffdf1}
    *{box-sizing:border-box}
    body{margin:0;background:var(--yellow);color:var(--navy);font-family:system-ui,"Noto Sans JP",sans-serif}
    header{padding:18px 22px;background:var(--navy);color:var(--yellow);font-weight:900;font-size:23px;box-shadow:0 6px var(--pink)}
    main{max-width:650px;margin:34px auto;padding:0 16px}
    .screen{display:none}.screen.active{display:block}
    .hero{text-align:center}.hero h1{font-size:34px;margin:10px}
    .panel{background:var(--paper);border:4px solid var(--navy);border-radius:12px;padding:22px;margin-top:22px;box-shadow:7px 7px var(--navy)}
    label{display:block;font-weight:800;margin:15px 0 6px}
    input,textarea,select{font:inherit;padding:12px;width:100%;border:3px solid var(--navy);border-radius:8px}
    button{font:inherit;font-weight:800;padding:13px;width:100%;margin:7px 0;border:3px solid var(--navy);border-radius:8px;background:var(--pink);cursor:pointer;box-shadow:3px 3px var(--navy)}
    button.alt{background:var(--mint)}button:disabled{opacity:.5}
    .code{text-align:center;font-size:34px;font-weight:900;letter-spacing:.15em;background:#fff1b2;padding:12px;border:2px dashed var(--navy)}
    .players,.scores{line-height:1.9}.muted{text-align:center;color:#59627b}
    .topic{text-align:center;font-size:38px;font-weight:900;background:#fff1b2;border:3px solid var(--navy);padding:25px;margin:15px 0}
    .hidden{display:none!important}.error{color:#a12238;font-weight:bold;text-align:center}
    .choice{background:#fff;text-align:left}.selected{background:#fff1b2!important}
  </style>
</head>
<body>
<header>★ えいごだーけ</header>

<main>
  <section id="home" class="screen active">
    <div class="hero"><h1>ことばで遊ぼう！</h1><p>説明して、当ててもらって、勝利点を目指そう。</p></div>
    <div class="panel">
      <label>ニックネーム</label>
      <input id="name" maxlength="16" placeholder="あきら">
      <button id="go">はじめる</button>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="hero"><h1>どうやって遊ぶ？</h1></div>
    <div class="panel">
      <button id="new">ルームを作る</button>
      <button class="alt" id="join">パスワードで参加</button>
    </div>
  </section>

  <section id="create" class="screen">
    <div class="hero"><h1>勝利点を決めよう</h1></div>
    <div class="panel">
      <input id="goal" type="number" min="1" value="5">
      <button id="make">ルーム作成</button>
    </div>
  </section>

  <section id="joinbox" class="screen">
    <div class="hero"><h1>ルームに参加</h1></div>
    <div class="panel">
      <label>パスワード</label>
      <input id="roomInput" maxlength="8">
      <button id="enter" class="alt">参加する</button>
    </div>
  </section>

  <section id="lobby" class="screen">
    <div class="hero"><h1>待機室</h1><p id="lobbyText">参加者を待っています</p></div>
    <div class="panel">
      <div class="code" id="roomCode"></div>
      <div class="players" id="players"></div>
      <p>勝利点：<b id="goalOut"></b> 点</p>
      <button id="start">ゲーム開始</button>
    </div>
  </section>

  <section id="setup" class="screen">
    <div class="hero"><h1 id="setupTitle">出題カードを選ぼう</h1><p>出題者が言語と難易度を選択中…</p></div>
    <div class="panel">
      <label>説明する言語</label>
      <button class="choice selected" id="jaMode">🇬🇧 日本語のお題 → 英語で説明<br>例「ふとん」→ “You use it when you sleep.”</button>
      <button class="choice" id="enMode">🇯🇵 英語のお題 → 日本語で説明<br>例 “umbrella” →「雨の日に使うもの」</button>
      <label>説明の難易度</label>
      <select id="difficulty">
        <option>簡単</option><option>普通</option><option>難しい</option><option>地獄級</option>
      </select>
      <button id="draw">カードを引く 🎴</button>
    </div>
  </section>

  <section id="play" class="screen">
    <div class="hero"><h1 id="turn"></h1><p id="publicState"></p></div>
    <div class="panel">
      <p id="roundInfo"></p>
      <div id="topic" class="topic"></div>
      <div id="answerArea">
        <label>答えを入力（回答言語は自由）</label>
        <input id="answer" maxlength="100">
        <button id="submitAnswer" class="alt">回答する</button>
        <div id="answers"></div>
      </div>
      <div id="judgeArea"></div>
      <div id="scoreboard" class="scores"></div>
      <button id="next" class="hidden">次の問題へ</button>
    </div>
  </section>

  <section id="end" class="screen">
    <div class="hero"><h1>🏆 ゲーム終了！</h1><p id="winner"></p></div>
    <div class="panel"><div id="finalScores"></div></div>
  </section>

  <p id="error" class="error"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAegX7MMVWdlYU6F8DuFslr4weRqpz9mX8",
  authDomain: "only-eigo----en-with-jp.firebaseapp.com",
  databaseURL: "https://only-eigo----en-with-jp-default-rtdb.firebaseio.com",
  projectId: "only-eigo----en-with-jp",
  storageBucket: "only-eigo----en-with-jp.firebasestorage.app",
  messagingSenderId: "179022374316",
  appId: "1:179022374316:web:f3412c6093423af3480609"
});

const db = getDatabase(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);

let uid = "";
let name = "";
let room = "";
let host = false;
let mode = "ja";
let unsubscribe = null;

const words = {
  ja: ["ふとん","りんご","傘","冷蔵庫","電車","おにぎり","信号","こたつ","歯ブラシ","自転車","花火","財布","雪だるま","目覚まし時計","図書館","水泳","風船","カレー","温泉","影","掃除機","新幹線","花見","忍者","天ぷら","迷子","充電器","虹","誕生日","秘密"],
  en: ["umbrella","apple","train","pillow","backpack","shadow","refrigerator","bicycle","library","fireworks","wallet","snowman","toothbrush","balloon","curry","hot spring","alarm clock","rainbow","birthday","secret","vacuum cleaner","sunglasses","sandwich","key","camera","stairs","cloud","lunchbox","toothpaste","weekend"]
};

function show(id) {
  document.querySelectorAll(".screen").forEach(x => x.classList.toggle("active", x.id === id));
  scrollTo(0, 0);
}

function roomRef() {
  return ref(db, "rooms/" + room);
}

function error(text) {
  $("error").textContent = text;
}

function roomCode() {
  return Math.random().toString(36).slice(2, 6).toUpperCase();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

signInAnonymously(auth).catch(e => error(e.message));
onAuthStateChanged(auth, user => uid = user?.uid || "");

$("go").onclick = () => {
  name = $("name").value.trim();
  if (!name) return error("ニックネームを入力してください");
  show("menu");
};

$("new").onclick = () => show("create");
$("join").onclick = () => show("joinbox");

$("make").onclick = async () => {
  if (!uid) return error("接続中です。少し待ってください");

  room = roomCode();
  host = true;

  await set(roomRef(), {
    status: "lobby",
    goal: Math.max(1, Number($("goal").value) || 5),
    players: { [uid]: { name, score: 0 } },
    used: {},
    round: 0
  });

  watchRoom();
  show("lobby");
};

$("enter").onclick = async () => {
  if (!uid) return error("接続中です");

  room = $("roomInput").value.trim().toUpperCase();
  const data = (await get(roomRef())).val();

  if (!data) return error("ルームが見つかりません");
  if (data.status !== "lobby") return error("このゲームはすでに始まっています");

  await update(ref(db, "rooms/" + room + "/players/" + uid), { name, score: 0 });
  host = false;
  watchRoom();
  show("lobby");
};

$("start").onclick = async () => {
  const data = (await get(roomRef())).val();
  if (Object.keys(data.players || {}).length < 2) return error("2人以上で開始してください");
  await update(roomRef(), { status: "setup", round: 1, speakerIndex: 0 });
};

$("jaMode").onclick = () => setMode("ja");
$("enMode").onclick = () => setMode("en");

function setMode(value) {
  mode = value;
  $("jaMode").classList.toggle("selected", value === "ja");
  $("enMode").classList.toggle("selected", value === "en");
}

function watchRoom() {
  if (unsubscribe) unsubscribe();

  unsubscribe = onValue(roomRef(), snap => {
    const data = snap.val();
    if (!data) return;

    const players = data.players || {};
    $("roomCode").textContent = room;
    $("goalOut").textContent = data.goal;

    $("players").innerHTML = Object.entries(players)
      .map(([id, player]) => `<div>${id === uid ? "★ " : ""}${escapeHtml(player.name)}　${player.score || 0}点</div>`)
      .join("");

    $("start").classList.toggle("hidden", !host);
    $("lobbyText").textContent = host ? "メンバーが揃ったら開始！" : "ホストが開始するのを待っています";

    if (data.status === "setup") renderSetup(data);
    if (data.status === "play") renderPlay(data);
    if (data.status === "end") renderEnd(data);
  });
}

function renderSetup(data) {
  show("setup");

  const ids = Object.keys(data.players || {});
  const speaker = ids[data.speakerIndex % ids.length];
  const mine = speaker === uid;

  $("setupTitle").textContent = mine
    ? "出題カードを選ぼう"
    : (data.players[speaker]?.name || "出題者") + "が準備中…";

  ["jaMode", "enMode", "difficulty", "draw"].forEach(id => $(id).disabled = !mine);
  $("draw").onclick = drawCard;
}

async function drawCard() {
  const data = (await get(roomRef())).val();
  const difficulty = $("difficulty").value;

  const available = words[mode]
    .map((_, index) => mode + "-" + index)
    .filter(key => !data.used?.[key]);

  if (!available.length) return error("この言語のお題を使い切りました");

  const key = available[Math.floor(Math.random() * available.length)];
  const index = Number(key.split("-")[1]);
  const ids = Object.keys(data.players);
  const speaker = ids[data.speakerIndex % ids.length];

  await update(roomRef(), {
    status: "play",
    mode: mode === "ja" ? "日本語のお題 → 英語で説明" : "英語のお題 → 日本語で説明",
    difficulty,
    topic: words[mode][index],
    topicKey: key,
    speaker,
    answers: {},
    judge: null
  });

  await update(ref(db, "rooms/" + room + "/used/" + key), true);
}

function renderPlay(data) {
  show("play");

  const mine = data.speaker === uid;
  $("turn").textContent = mine ? "あなたが出題者！" : (data.players?.[data.speaker]?.name || "出題者") + "が説明中";
  $("publicState").textContent = "出題者が説明中…　難易度：" + data.difficulty;
  $("roundInfo").textContent = "ROUND " + data.round + "　・　" + data.mode;
  $("topic").textContent = mine ? data.topic : "お題は出題者だけに表示";

  $("answerArea").classList.toggle("hidden", mine || !!data.judge);
  $("judgeArea").innerHTML = "";
  $("next").classList.add("hidden");

  const answers = data.answers || {};

  if (mine && !data.judge) {
    $("answers").innerHTML = Object.entries(answers)
      .map(([id, answer]) => `<button class="choice answerPick" data-id="${id}">${escapeHtml(data.players[id]?.name || "参加者")}：${escapeHtml(answer.text)}</button>`)
      .join("") || "<p>回答待ち…</p>";

    document.querySelectorAll(".answerPick").forEach(button => {
      button.onclick = () => resolveRound("correct", button.dataset.id);
    });

    $("judgeArea").innerHTML = `
      <button id="skip" class="alt">今回はパス／時間切れ</button>
      <button id="language" style="background:#ffd45b">禁止言語を指摘された</button>
    `;

    $("skip").onclick = () => resolveRound("skip");
    $("language").onclick = languagePenalty;
  }

  if (data.judge) {
    $("answerArea").classList.add("hidden");
    $("judgeArea").textContent = data.judge.message;
    $("next").classList.toggle("hidden", !mine);
    $("next").onclick = nextRound;
  }

  $("scoreboard").innerHTML = "<h3>スコア</h3>" +
    Object.values(data.players || {})
      .map(player => `<div>${escapeHtml(player.name)}：${player.score || 0}点</div>`)
      .join("");
}

$("submitAnswer").onclick = async () => {
  const text = $("answer").value.trim();
  if (!text) return;

  const data = (await get(roomRef())).val();
  if (data.speaker === uid || data.judge) return;

  await update(ref(db, "rooms/" + room + "/answers/" + uid), {
    text,
    at: Date.now()
  });

  $("answer").value = "";
};

async function resolveRound(kind, playerId) {
  const data = (await get(roomRef())).val();
  if (!data || data.judge) return;

  const players = data.players || {};
  let message = "";

  if (kind === "correct") {
    players[playerId].score = (players[playerId].score || 0) + 1;
    players[data.speaker].score = (players[data.speaker].score || 0) + 1;
    message = "正解！" + players[playerId].name + "さんと出題者に1点！";
  } else {
    message = "この問題は終了。得点なし";
  }

  await update(roomRef(), {
    players,
    judge: { kind, message }
  });
}

async function languagePenalty() {
  const data = (await get(roomRef())).val();
  const others = Object.entries(data.players).filter(([id]) => id !== data.speaker);

  $("judgeArea").innerHTML = "<p>指摘した人を選択</p>" +
    others.map(([id, player]) =>
      `<button class="choice langPick" data-id="${id}">${escapeHtml(player.name)}に1点</button>`
    ).join("");

  document.querySelectorAll(".langPick").forEach(button => {
    button.onclick = async () => {
      const fresh = (await get(roomRef())).val();
      const players = fresh.players;

      players[button.dataset.id].score = (players[button.dataset.id].score || 0) + 1;

      await update(roomRef(), {
        players,
        judge: {
          kind: "language",
          message: "言語違反！" + players[button.dataset.id].name + "さんに1点。出題者には入りません。"
        }
      });
    };
  });
}

async function nextRound() {
  const data = (await get(roomRef())).val();
  const ids = Object.keys(data.players);
  const nextIndex = (data.speakerIndex + 1) % ids.length;
  const winner = Object.entries(data.players).find(([, player]) => player.score >= data.goal);

  if (winner) {
    await update(roomRef(), { status: "end", winner: winner[0] });
    return;
  }

  await update(roomRef(), {
    status: "setup",
    speakerIndex: nextIndex,
    round: (data.round || 1) + 1,
    judge: null,
    answers: {},
    topic: null
  });
}

function renderEnd(data) {
  show("end");
  $("winner").textContent = (data.players[data.winner]?.name || "プレイヤー") + "の勝利！";

  $("finalScores").innerHTML = Object.values(data.players)
    .sort((a, b) => b.score - a.score)
    .map(player => `<p>${escapeHtml(player.name)}：${player.score}点</p>`)
    .join("");
}
</script>
</body>
</html>
